<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Bassin d'Automne</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;600&family=Zen+Kaku+Gothic+New:wght@300;400&display=swap">
<style>
/* Layout : vue plongeante sur un bassin plein écran ; titre vertical à droite comme un kakejiku, commandes en bas. Thème unique (eau sombre). */
:root{
  --pond:#0b2426;
  --paper:#f3ead8;
  --mist:#9fb5ad;
  --maple:#e0542e;
  --glass:rgba(8,28,30,.55);
  --line:rgba(243,234,216,.16);
  --f-display:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",Georgia,serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0;overflow:hidden;background:var(--pond);color:var(--paper)}
body{font-family:var(--f-body);-webkit-tap-highlight-color:transparent;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:pointer}
.hud{position:fixed;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;
  padding:calc(env(safe-area-inset-top,0px) + 18px) 18px calc(env(safe-area-inset-bottom,0px) + 18px)}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.stats{font-size:11px;letter-spacing:.14em;color:var(--mist);line-height:1.9;font-variant-numeric:tabular-nums}
.stats b{color:var(--paper);font-weight:400}
.scroll{writing-mode:vertical-rl;font-family:var(--f-display);display:flex;gap:10px;align-items:flex-start}
.scroll .jp{font-size:clamp(26px,5vw,38px);letter-spacing:.3em;font-weight:600}
.scroll .fr{font-size:12px;letter-spacing:.32em;color:var(--mist)}
.seal{writing-mode:horizontal-tb;width:26px;height:26px;border-radius:4px;background:var(--maple);color:var(--paper);display:grid;place-items:center;font-size:13px;font-weight:600;margin-top:6px}
.bottom{display:flex;flex-direction:column;align-items:center;gap:14px}
.hint{font-size:12px;letter-spacing:.08em;color:var(--mist);text-align:center;transition:opacity 1.5s;max-width:36ch;line-height:1.7}
.bar{display:flex;gap:8px;pointer-events:auto;flex-wrap:wrap;justify-content:center}
.bar button{font:inherit;font-size:12px;letter-spacing:.16em;color:var(--paper);background:var(--glass);border:1px solid var(--line);border-radius:999px;
  padding:11px 18px;cursor:pointer;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:border-color .3s,background .3s,transform .15s}
.bar button:hover{border-color:rgba(224,84,46,.6);background:rgba(224,84,46,.14)}
.bar button:active{transform:scale(.96)}
.bar button:focus-visible{outline:1px solid var(--maple);outline-offset:3px}
.bar button[aria-pressed="true"]{color:var(--mist)}

.intro{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding-inline:24px;text-align:center;
  background:radial-gradient(ellipse at center,rgba(5,20,21,.2),rgba(5,20,21,.88) 72%);transition:opacity 1.8s ease,backdrop-filter 1.8s;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.intro.gone{opacity:0;pointer-events:none;backdrop-filter:blur(0)}
.intro .kanji{font-family:var(--f-display);font-size:clamp(54px,15vw,120px);font-weight:600;letter-spacing:.18em;margin:0;line-height:1}
.intro .kanji span{display:inline-block;opacity:0;transform:translateY(-30px) rotate(-8deg);animation:fall 1.8s cubic-bezier(.2,.8,.2,1) forwards}
.intro h2{font-family:var(--f-display);font-weight:400;font-size:clamp(20px,4.6vw,30px);letter-spacing:.24em;margin:0;opacity:0;animation:fade 1.6s 1.3s forwards}
.intro p{max-width:40ch;margin:0;font-size:13px;line-height:1.95;color:var(--mist);opacity:0;animation:fade 1.6s 1.8s forwards}
.go{font:inherit;font-size:13px;letter-spacing:.3em;color:var(--paper);background:var(--maple);border:0;border-radius:999px;padding:15px 34px 15px 38px;cursor:pointer;
  opacity:0;animation:fade 1.4s 2.3s forwards,glow 3.4s 3.8s ease-in-out infinite}
.go:focus-visible{outline:1px solid var(--paper);outline-offset:5px}
@keyframes fall{to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(224,84,46,.5)}50%{box-shadow:0 0 0 14px rgba(224,84,46,0)}}
@media (prefers-reduced-motion:reduce){.intro *{animation-duration:.01s!important;animation-delay:0s!important}}
</style>

<canvas id="pond" aria-label="Bassin de koïs : touchez l'eau pour nourrir les poissons"></canvas>

<div class="hud">
  <div class="top">
    <div class="stats"><b id="nKoi">7</b> koïs<br><b id="nBites">0</b> bouchées<br><b id="nLeaves">0</b> feuilles</div>
    <div class="scroll"><span class="jp">秋の池</span><span class="fr">Bassin d'Automne</span><span class="seal">鯉</span></div>
  </div>
  <div class="bottom">
    <div class="hint" id="hint">Touchez l'eau pour jeter du grain · touchez un koï pour lire son nom</div>
    <div class="bar">
      <button id="bGust" type="button">Brise</button>
      <button id="bChime" type="button">Carillon</button>
      <button id="bMute" type="button" aria-pressed="false">Son</button>
    </div>
  </div>
</div>

<div class="intro" id="intro">
  <div class="kanji"><span style="animation-delay:.2s">秋</span><span style="animation-delay:.45s">の</span><span style="animation-delay:.7s">池</span></div>
  <h2>Bassin d'Automne</h2>
  <p>Sept koïs tournent sous les feuilles d'érable. Jetez du grain, écoutez l'eau, et attendez le claquement du bambou.</p>
  <button class="go" id="go" type="button">Entrer</button>
</div>

<script>
(()=>{
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches, TAU=Math.PI*2;
const rnd=(a,b)=>a+Math.random()*(b-a), clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const angDiff=(a,b)=>{let d=(b-a)%TAU; if(d>Math.PI)d-=TAU; if(d<-Math.PI)d+=TAU; return d};

const cvs=document.getElementById('pond'), ctx=cvs.getContext('2d');
let W,H,DPR,S,floor,cau,cctx,cimg;
function resize(){
  DPR=Math.min(devicePixelRatio||1,2); W=innerWidth; H=innerHeight;
  cvs.width=W*DPR; cvs.height=H*DPR; ctx.setTransform(DPR,0,0,DPR,0,0);
  S=Math.min(W,H);
  buildFloor();
  cau=document.createElement('canvas'); cau.width=Math.ceil(W/9); cau.height=Math.ceil(H/9);
  cctx=cau.getContext('2d'); cimg=cctx.createImageData(cau.width,cau.height);
  placePads();
}
function buildFloor(){
  floor=document.createElement('canvas'); floor.width=W*DPR; floor.height=H*DPR;
  const f=floor.getContext('2d'); f.scale(DPR,DPR);
  const g=f.createRadialGradient(W*.45,H*.4,0,W/2,H/2,Math.hypot(W,H)*.6);
  g.addColorStop(0,'#1f5550'); g.addColorStop(.55,'#123a3a'); g.addColorStop(1,'#061719');
  f.fillStyle=g; f.fillRect(0,0,W,H);
  for(let i=0;i<Math.floor(W*H/900);i++){
    const x=Math.random()*W,y=Math.random()*H,r=rnd(1,S*.022);
    f.fillStyle=Math.random()<.5?`rgba(0,10,12,${rnd(.08,.22)})`:`rgba(170,200,180,${rnd(.02,.06)})`;
    f.beginPath(); f.ellipse(x,y,r,r*rnd(.5,.9),Math.random()*TAU,0,TAU); f.fill();
  }
  // herbes d'eau
  f.lineCap='round';
  for(let i=0;i<26;i++){const x=Math.random()*W,y=Math.random()*H,a=Math.random()*TAU,l=rnd(.06,.16)*S;
    f.strokeStyle=`rgba(60,110,70,${rnd(.12,.25)})`; f.lineWidth=rnd(2,5);
    f.beginPath(); f.moveTo(x,y); f.quadraticCurveTo(x+Math.cos(a+.6)*l*.6,y+Math.sin(a+.6)*l*.6,x+Math.cos(a)*l,y+Math.sin(a)*l); f.stroke()}
}

/* ---------- koïs ---------- */
const VARIETIES=[
  {jp:'紅白',name:'Kohaku',base:'#f2ece1',fin:'rgba(242,236,225,.55)',patches:[[.12,0,.8,'#d9412a'],[.38,.2,.9,'#d9412a'],[.62,-.2,.7,'#d9412a']]},
  {jp:'丹頂',name:'Tanchō',base:'#f4efe6',fin:'rgba(244,239,230,.55)',patches:[[.07,0,.62,'#d63a26']]},
  {jp:'昭和',name:'Shōwa',base:'#1b1a1e',fin:'rgba(40,38,42,.6)',patches:[[.1,.1,.8,'#d8462c'],[.32,-.4,.8,'#efe9dd'],[.5,.4,.85,'#d8462c'],[.7,-.1,.6,'#efe9dd']]},
  {jp:'山吹',name:'Yamabuki',base:'#eab23a',fin:'rgba(240,190,80,.55)',patches:[]},
  {jp:'浅黄',name:'Asagi',base:'#7d95a8',fin:'rgba(200,110,80,.55)',patches:[[.25,1.1,.7,'#d8643c'],[.25,-1.1,.7,'#d8643c'],[.55,1.1,.6,'#d8643c'],[.55,-1.1,.6,'#d8643c']]},
  {jp:'茶鯉',name:'Chagoi',base:'#a8733f',fin:'rgba(168,115,63,.55)',patches:[]},
  {jp:'黄金',name:'Ōgon',base:'#ddd6c6',fin:'rgba(230,224,210,.55)',patches:[]},
];
const SEG=16;
let fish=[];
function makeFish(v,i){
  const L=S*rnd(.15,.21), x=rnd(.2,.8)*W, y=rnd(.2,.8)*H, a=Math.random()*TAU;
  const f={v,L,seg:L/(SEG-1),ang:a,turn:0,speed:rnd(.08,.12)*S,boost:0,phase:Math.random()*TAU,label:0,target:null,P:[]};
  for(let k=0;k<SEG;k++) f.P.push({x:x-Math.cos(a)*f.seg*k,y:y-Math.sin(a)*f.seg*k});
  return f;
}
function initFish(){fish=VARIETIES.map(makeFish)}

function stepFish(f,dt){
  const h=f.P[0], m=S*.12;
  // cible : grain le plus proche
  if(!f.target||f.target.gone){ f.target=null; let bd=S*.55;
    for(const p of pellets){ if(p.gone) continue; const d=Math.hypot(p.x-h.x,p.y-h.y); if(d<bd){bd=d;f.target=p} } }
  let want=null;
  if(f.target) want=Math.atan2(f.target.y-h.y,f.target.x-h.x);
  else { f.turn+=(Math.random()-.5)*dt*2.4; f.turn*=Math.pow(.6,dt); f.turn=clamp(f.turn,-.9,.9) }
  // bords
  if(h.x<m||h.x>W-m||h.y<m||h.y>H-m) want=Math.atan2(H/2-h.y,W/2-h.x);
  // séparation
  for(const o of fish){ if(o===f) continue; const d=Math.hypot(o.P[0].x-h.x,o.P[0].y-h.y); if(d<f.L*.5&&!f.target){ f.turn+=(angDiff(f.ang,Math.atan2(h.y-o.P[0].y,h.x-o.P[0].x))>0?1:-1)*dt*1.5 } }
  if(want!==null){ f.ang+=clamp(angDiff(f.ang,want),-1,1)*dt*(f.target?3.2:1.6) } else f.ang+=f.turn*dt;
  f.boost*=Math.pow(.25,dt);
  const sp=(f.target?f.speed*1.9:f.speed)*(1+f.boost*3);
  f.phase+=dt*(3+sp/S*30);
  const wig=Math.sin(f.phase)*.22;
  h.x+=Math.cos(f.ang+wig)*sp*dt; h.y+=Math.sin(f.ang+wig)*sp*dt;
  for(let k=1;k<SEG;k++){ const a=f.P[k-1], b=f.P[k], dx=b.x-a.x, dy=b.y-a.y, d=Math.hypot(dx,dy)||1;
    b.x=a.x+dx/d*f.seg; b.y=a.y+dy/d*f.seg }
  // manger
  if(f.target && Math.hypot(f.target.x-h.x,f.target.y-h.y)<f.L*.09){ eat(f,f.target) }
  f.label=Math.max(0,f.label-dt);
}
function profile(t){ return Math.pow(Math.sin(Math.PI*Math.min(1,t*.86+.14)),.75)*(1-t*.45) }
function bodyPath(f,ox=0,oy=0){
  const L=[],R=[],P=f.P, Wm=f.L*.11;
  for(let k=0;k<SEG;k++){
    const a=P[Math.max(0,k-1)], b=P[Math.min(SEG-1,k+1)], ang=Math.atan2(a.y-b.y,a.x-b.x), w=Wm*profile(k/(SEG-1));
    const nx=-Math.sin(ang), ny=Math.cos(ang);
    L.push([P[k].x+nx*w+ox,P[k].y+ny*w+oy]); R.push([P[k].x-nx*w+ox,P[k].y-ny*w+oy]);
  }
  const hd=Math.atan2(P[0].y-P[1].y,P[0].x-P[1].x), w0=Wm*profile(0);
  const tip=[P[0].x+Math.cos(hd)*w0*1.5+ox,P[0].y+Math.sin(hd)*w0*1.5+oy];
  const path=new Path2D(); path.moveTo(...R[0]); path.quadraticCurveTo(tip[0]+(R[0][0]-L[0][0])*.35,tip[1]+(R[0][1]-L[0][1])*.35,...tip);
  path.quadraticCurveTo(tip[0]+(L[0][0]-R[0][0])*.35,tip[1]+(L[0][1]-R[0][1])*.35,...L[0]);
  for(let k=1;k<SEG;k++){const p=L[k-1],q=L[k];path.quadraticCurveTo(p[0],p[1],(p[0]+q[0])/2,(p[1]+q[1])/2)}
  path.lineTo(...L[SEG-1]); path.lineTo(...R[SEG-1]);
  for(let k=SEG-2;k>=0;k--){const p=R[k+1],q=R[k];path.quadraticCurveTo(p[0],p[1],(p[0]+q[0])/2,(p[1]+q[1])/2)}
  path.closePath(); return path;
}
function finPaths(f,ox=0,oy=0){
  const P=f.P, n=SEG-1, a=Math.atan2(P[n-1].y-P[n].y,P[n-1].x-P[n].x), back=a+Math.PI, flap=Math.sin(f.phase-1.4)*.5;
  const t=P[n], L=f.L, path=new Path2D();
  // nageoire caudale
  const c1=[t.x+Math.cos(back+.55+flap)*L*.2+ox,t.y+Math.sin(back+.55+flap)*L*.2+oy], c2=[t.x+Math.cos(back-.55+flap)*L*.2+ox,t.y+Math.sin(back-.55+flap)*L*.2+oy];
  const mid=[t.x+Math.cos(back+flap)*L*.12+ox,t.y+Math.sin(back+flap)*L*.12+oy];
  path.moveTo(t.x+ox,t.y+oy); path.quadraticCurveTo(c1[0]-Math.cos(back)*L*.03,c1[1]-Math.sin(back)*L*.03,...c1);
  path.quadraticCurveTo(...mid,...c2); path.quadraticCurveTo(c2[0]-Math.cos(back)*L*.03,c2[1]-Math.sin(back)*L*.03,t.x+ox,t.y+oy);
  // nageoires pectorales
  const b=P[3], ba=Math.atan2(P[2].y-P[4].y,P[2].x-P[4].x), pf=Math.sin(f.phase*.7)*.35;
  for(const s of [1,-1]){ const fa=ba+Math.PI+s*(1.0+pf), w=f.L*.11*profile(3/n);
    const bx=b.x+Math.cos(ba+s*Math.PI/2)*w*.8+ox, by=b.y+Math.sin(ba+s*Math.PI/2)*w*.8+oy;
    path.moveTo(bx,by); path.ellipse(bx+Math.cos(fa)*L*.06,by+Math.sin(fa)*L*.06,L*.075,L*.03,fa,0,TAU) }
  return path;
}
function drawShadow(f){
  const o=S*.018; ctx.fillStyle='rgba(0,8,10,.28)'; ctx.fill(bodyPath(f,o,o*1.4)); ctx.fill(finPaths(f,o,o*1.4));
}
function drawFish(f){
  const v=f.v, body=bodyPath(f);
  ctx.fillStyle=v.fin; ctx.fill(finPaths(f));
  ctx.save(); ctx.clip(body);
  ctx.fillStyle=v.base; ctx.fill(body);
  const Wm=f.L*.11;
  for(const[t,off,r,c] of v.patches){
    const k=Math.round(t*(SEG-1)), a=f.P[Math.max(0,k-1)], b=f.P[Math.min(SEG-1,k+1)], ang=Math.atan2(a.y-b.y,a.x-b.x), w=Wm*profile(t);
    const x=f.P[k].x-Math.sin(ang)*w*off, y=f.P[k].y+Math.cos(ang)*w*off;
    ctx.fillStyle=c; ctx.beginPath(); ctx.ellipse(x,y,w*r*1.6,w*r*1.1,ang,0,TAU); ctx.fill();
  }
  // reflet dorsal
  ctx.strokeStyle='rgba(255,255,255,.22)'; ctx.lineWidth=Wm*.35; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(f.P[1].x,f.P[1].y); for(let k=2;k<SEG*.7;k++) ctx.lineTo(f.P[k].x,f.P[k].y); ctx.stroke();
  ctx.restore();
  // yeux
  const hd=Math.atan2(f.P[0].y-f.P[1].y,f.P[0].x-f.P[1].x), w0=Wm*profile(0)*.75;
  ctx.fillStyle='rgba(10,10,12,.85)';
  for(const s of [1,-1]){ctx.beginPath();ctx.arc(f.P[0].x+Math.cos(hd)*w0*.6+Math.cos(hd+s*Math.PI/2)*w0,f.P[0].y+Math.sin(hd)*w0*.6+Math.sin(hd+s*Math.PI/2)*w0,Math.max(1,Wm*.12),0,TAU);ctx.fill()}
}

/* ---------- grain, feuilles, nénuphars, rides ---------- */
let pellets=[], leaves=[], ripples=[], bubbles=[], pads=[], bites=0, landed=0;
const elB=document.getElementById('nBites'), elL=document.getElementById('nLeaves'), hint=document.getElementById('hint');
function ripple(x,y,max,str=1){ripples.push({x,y,r:2,max,life:1,str})}
function eat(f,p){
  p.gone=true; f.target=null; f.boost=.5; bites++; elB.textContent=bites;
  ripple(p.x,p.y,S*.06,.8); for(let i=0;i<5;i++) bubbles.push({x:p.x+rnd(-6,6),y:p.y+rnd(-6,6),r:rnd(1.5,4),life:rnd(.6,1.2)});
  sfxGulp(); }

const LEAF=(()=>{const p=new Path2D(), n=60;
  for(let i=0;i<=n;i++){const th=i/n*TAU-Math.PI/2, lobe=Math.pow(Math.abs(Math.cos(th*2.5+Math.PI/4*0)),.6);
    let r=.45+.55*lobe; if(Math.sin(th)>.55) r*=.55; r*=1+(i%2?.06:0);
    const x=Math.cos(th)*r, y=Math.sin(th)*r; i?p.lineTo(x,y):p.moveTo(x,y)}
  p.closePath(); return p})();
function spawnLeaf(burst){
  leaves.push({x:rnd(-.1,1.1)*W,y:rnd(-.1,.9)*H,z:1,vz:rnd(.1,.18),rot:Math.random()*TAU,vr:rnd(-1.2,1.2),size:S*rnd(.028,.045),
    hue:rnd(2,38),light:rnd(38,54),drift:rnd(.2,1),ph:Math.random()*TAU,wind:burst?rnd(.06,.12)*S:0,age:0});
}
function placePads(){
  pads=[[.12,.78,.075,0],[.86,.22,.06,0],[.8,.84,.09,1],[.2,.18,.05,0],[.55,.9,.045,0]].map(([x,y,r,lotus])=>({x:x*W,y:y*H,r:r*S,rot:Math.random()*TAU,lotus,ph:Math.random()*TAU}));
}
function drawPad(p,T){
  const bob=Math.sin(T*.6+p.ph)*.03, r=p.r*(1+bob*.2);
  ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot+bob);
  ctx.fillStyle='rgba(0,10,10,.3)'; ctx.beginPath(); ctx.moveTo(r*.15,r*.2); ctx.arc(r*.15,r*.2,r,.3,TAU-.05); ctx.fill();
  const g=ctx.createRadialGradient(-r*.2,-r*.2,0,0,0,r); g.addColorStop(0,'#5f9a4c'); g.addColorStop(1,'#2d5e33');
  ctx.fillStyle=g; ctx.beginPath(); ctx.moveTo(0,0); ctx.arc(0,0,r,.35,TAU); ctx.closePath(); ctx.fill();
  ctx.strokeStyle='rgba(180,220,150,.18)'; ctx.lineWidth=1; ctx.beginPath();
  for(let k=0;k<11;k++){const a=.35+k*(TAU-.35)/11; ctx.moveTo(0,0); ctx.lineTo(Math.cos(a)*r*.92,Math.sin(a)*r*.92)} ctx.stroke();
  if(p.lotus){ for(let layer=0;layer<3;layer++){ const n=8-layer*2, pr=r*(.55-layer*.14);
      for(let k=0;k<n;k++){const a=k*TAU/n+layer*.4+T*.02; ctx.save(); ctx.rotate(a);
        const pg=ctx.createLinearGradient(0,0,pr,0); pg.addColorStop(0,'#fff4f2'); pg.addColorStop(1,layer?'#f2a6b4':'#e88ba0');
        ctx.fillStyle=pg; ctx.beginPath(); ctx.ellipse(pr*.55,0,pr*.55,pr*.22,0,0,TAU); ctx.fill(); ctx.restore()} }
    ctx.fillStyle='#f3cc4f'; ctx.beginPath(); ctx.arc(0,0,r*.09,0,TAU); ctx.fill() }
  ctx.restore();
}

/* ---------- audio ---------- */
let AC=null, master, wet, muted=false, nbuf;
function impulse(dur,dec){const len=AC.sampleRate*dur,b=AC.createBuffer(2,len,AC.sampleRate);
  for(let c=0;c<2;c++){const d=b.getChannelData(c);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,dec)}return b}
function noise(){ if(!nbuf){nbuf=AC.createBuffer(1,AC.sampleRate*4,AC.sampleRate);const c=nbuf.getChannelData(0);let l=0;
    for(let i=0;i<c.length;i++){c[i]=Math.random()*2-1}} const s=AC.createBufferSource(); s.buffer=nbuf; s.loop=true; s.loopStart=Math.random()*3; return s }
function out(pan=0,dry=1,rev=.6){const g=AC.createGain();let n=g;
  if(AC.createStereoPanner){const p=AC.createStereoPanner();p.pan.value=clamp(pan,-1,1);g.connect(p);n=p}
  const d=AC.createGain();d.gain.value=dry;n.connect(d);d.connect(master);const r=AC.createGain();r.gain.value=rev;n.connect(r);r.connect(wet);return g}
function env(g,t,pk,a,d){g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(pk,t+a);g.gain.exponentialRampToValueAtTime(.0001,t+d)}
function osc(type,f,t){const o=AC.createOscillator();o.type=type;o.frequency.setValueAtTime(f,t);return o}
const panX=x=>(x/W)*1.6-.8;
function initAudio(){
  AC=new (window.AudioContext||window.webkitAudioContext)();
  const comp=AC.createDynamicsCompressor(); comp.threshold.value=-14; comp.ratio.value=3; comp.connect(AC.destination);
  master=AC.createGain(); master.gain.setValueAtTime(0,AC.currentTime); master.gain.linearRampToValueAtTime(.9,AC.currentTime+3); master.connect(comp);
  const conv=AC.createConvolver(); conv.buffer=impulse(2.8,3); wet=AC.createGain(); wet.gain.value=.5; wet.connect(conv); conv.connect(master);
  const t=AC.currentTime;
  // eau de fond : bruit grave + ruisselet modulé
  const n1=noise(), lp=AC.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=380; const g1=AC.createGain(); g1.gain.value=.07;
  n1.connect(lp); lp.connect(g1); g1.connect(master); n1.start(t);
  const n2=noise(), bp=AC.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=2400; bp.Q.value=1.2; const g2=AC.createGain(); g2.gain.value=.012;
  const am=osc('sine',.13,t), amg=AC.createGain(); amg.gain.value=.008; am.connect(amg); amg.connect(g2.gain); am.start(t);
  n2.connect(bp); bp.connect(g2); g2.connect(wet); g2.connect(master); n2.start(t);
  scheduleAmbience();
}
function sfxPlop(x,big=1){ if(!AC) return; const t=AC.currentTime, o=out(panX(x),.9,.7);
  const s=osc('sine',rnd(700,1000)*big,t); s.frequency.exponentialRampToValueAtTime(rnd(160,240),t+.09); env(o,t,.32,.003,.18); s.connect(o); s.start(t); s.stop(t+.2);
  const s2=osc('sine',rnd(1400,1800),t+.05), o2=out(panX(x),.6,.8); s2.frequency.exponentialRampToValueAtTime(500,t+.11); env(o2,t+.05,.1,.002,.12); s2.connect(o2); s2.start(t+.05); s2.stop(t+.2);
  const n=noise(), hp=AC.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=3000; const g=out(panX(x),.5,.5); env(g,t,.05,.002,.15); n.connect(hp); hp.connect(g); n.start(t); n.stop(t+.2);
}
function sfxGulp(){ if(!AC) return; const t=AC.currentTime;
  for(let i=0;i<3;i++){const tt=t+i*rnd(.05,.09), s=osc('sine',rnd(260,380),tt), o=out(rnd(-.3,.3),.7,.5);
    s.frequency.exponentialRampToValueAtTime(rnd(700,1100),tt+.06); env(o,tt,.12/(i+1),.004,.08); s.connect(o); s.start(tt); s.stop(tt+.1)} }
function sfxLeaf(x){ if(!AC) return; const t=AC.currentTime, s=osc('sine',rnd(1800,2600),t), o=out(panX(x),.4,.9);
  s.frequency.exponentialRampToValueAtTime(rnd(900,1200),t+.05); env(o,t,.03,.002,.08); s.connect(o); s.start(t); s.stop(t+.1) }
function sfxGust(){ if(!AC) return; const t=AC.currentTime, n=noise(), bp=AC.createBiquadFilter(); bp.type='bandpass'; bp.Q.value=.9;
  bp.frequency.setValueAtTime(300,t); bp.frequency.exponentialRampToValueAtTime(1400,t+1.4); bp.frequency.exponentialRampToValueAtTime(400,t+3.5);
  const g=AC.createGain(); g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(.22,t+1.2); g.gain.exponentialRampToValueAtTime(.0001,t+3.8);
  const p=AC.createStereoPanner?AC.createStereoPanner():null; n.connect(bp); bp.connect(g);
  if(p){p.pan.setValueAtTime(-.8,t);p.pan.linearRampToValueAtTime(.8,t+3.5);g.connect(p);p.connect(master);p.connect(wet)}else{g.connect(master)}
  n.start(t); n.stop(t+4);
  // froissement des feuilles
  for(let i=0;i<14;i++){const tt=t+.5+Math.random()*2.4, nn=noise(), hp=AC.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=rnd(3000,6000);
    const gg=out(rnd(-.8,.8),.4,.4); env(gg,tt,.03,.005,.06); nn.connect(hp); hp.connect(gg); nn.start(tt); nn.stop(tt+.08)} }
const PENTA=[1174.7,1318.5,1480,1760,1975.5,2349.3,2637];
function chimeNote(f,when,vel=1,pan=0){ const t=AC.currentTime+when, o=out(pan,.6,1.1); env(o,t,.08*vel,.002,4);
  [[1,1],[2.76,.35],[5.4,.15],[8.93,.06]].forEach(([m,a])=>{const s=osc('sine',f*m,t), g=AC.createGain(); env(g,t,a,.001,4/m**.5); s.connect(g); g.connect(o); s.start(t); s.stop(t+4.2)}) }
function sfxChime(){ if(!AC) return; let w=0; for(let i=0;i<rnd(6,10);i++){ w+=rnd(.08,.38); chimeNote(PENTA[Math.random()*PENTA.length|0],w,rnd(.5,1),rnd(-.7,.7)) } }
function sfxShishi(){ if(!AC) return; const t=AC.currentTime;
  // bascule : eau qui se déverse puis claquement du bambou
  const n=noise(), bp=AC.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=1200; bp.Q.value=2; const g=out(.6,.5,.8);
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(.08,t+.15); g.gain.exponentialRampToValueAtTime(.0001,t+.7); n.connect(bp); bp.connect(g); n.start(t); n.stop(t+.8);
  const tc=t+.75, k=noise(), kb=AC.createBiquadFilter(); kb.type='bandpass'; kb.frequency.value=1700; kb.Q.value=4; const kg=out(.6,1,1.3); env(kg,tc,.9,.001,.09);
  k.connect(kb); kb.connect(kg); k.start(tc); k.stop(tc+.12);
  const th=osc('sine',420,tc); th.frequency.exponentialRampToValueAtTime(140,tc+.12); const tg=out(.6,1,1.2); env(tg,tc,.5,.001,.22); th.connect(tg); th.start(tc); th.stop(tc+.25);
  const ring=osc('triangle',880,tc), rg=out(.6,.5,1); env(rg,tc,.08,.001,.35); ring.connect(rg); ring.start(tc); ring.stop(tc+.4);
  return .75 }
function sfxBird(){ if(!AC) return; const t=AC.currentTime, pan=rnd(-.9,.9), n=Math.floor(rnd(2,6)), base=rnd(2600,4200);
  for(let i=0;i<n;i++){const tt=t+i*rnd(.09,.16), s=osc('sine',base,tt), o=out(pan,.25,.9);
    s.frequency.exponentialRampToValueAtTime(base*rnd(1.2,1.6),tt+.04); s.frequency.exponentialRampToValueAtTime(base*rnd(.8,1),tt+.09);
    const tr=osc('sine',rnd(30,60),tt), tg=AC.createGain(); tg.gain.value=base*.04; tr.connect(tg); tg.connect(s.frequency);
    env(o,tt,.035,.005,.1); s.connect(o); s.start(tt); tr.start(tt); s.stop(tt+.12); tr.stop(tt+.12)} }
function tick(){ if(!AC) return; const t=AC.currentTime,s=osc('sine',1900,t),g=out(0,.4,.3); env(g,t,.03,.001,.05); s.connect(g); s.start(t); s.stop(t+.06) }
let nextShishi=0, nextBird=0;
function scheduleAmbience(){ nextShishi=T+12; nextBird=T+5 }

/* ---------- interaction ---------- */
let started=false;
function feed(x,y){
  const n=3+(Math.random()*3|0);
  for(let i=0;i<n;i++){const a=Math.random()*TAU,r=Math.random()*S*.03; pellets.push({x:x+Math.cos(a)*r,y:y+Math.sin(a)*r,life:1,born:T,gone:false})}
  ripple(x,y,S*.14,1.2); setTimeout(()=>ripple(x,y,S*.09,.7),180); sfxPlop(x); hint.style.opacity=0;
}
cvs.addEventListener('pointerdown',e=>{ if(!started) return;
  const r=cvs.getBoundingClientRect(), x=e.clientX-r.left, y=e.clientY-r.top;
  for(const f of fish){ for(let k=0;k<SEG*.7;k+=2){ if(Math.hypot(f.P[k].x-x,f.P[k].y-y)<f.L*.12){
    f.label=3.2; f.boost=1.2; f.ang+=rnd(-1,1); f.target=null; ripple(x,y,S*.1,1.4); sfxPlop(x,1.25);
    for(let i=0;i<8;i++) bubbles.push({x:x+rnd(-10,10),y:y+rnd(-10,10),r:rnd(1.5,4),life:rnd(.5,1)}); return } } }
  feed(x,y);
});
document.getElementById('bGust').onclick=()=>{ tick(); sfxGust(); for(let i=0;i<14;i++) setTimeout(()=>spawnLeaf(true),i*120);
  for(const l of leaves) if(l.z<=0) l.wind=rnd(.05,.1)*S; for(const f of fish) f.boost=.4 };
document.getElementById('bChime').onclick=()=>{ tick(); sfxChime(); shimmer=1 };
const bMute=document.getElementById('bMute');
bMute.onclick=()=>{ if(!AC) return; muted=!muted; const t=AC.currentTime; master.gain.cancelScheduledValues(t); master.gain.setValueAtTime(master.gain.value,t);
  master.gain.linearRampToValueAtTime(muted?0:.9,t+.6); bMute.setAttribute('aria-pressed',muted); bMute.textContent=muted?'Muet':'Son' };
document.getElementById('go').onclick=()=>{
  initAudio(); AC.resume&&AC.resume(); started=true;
  const intro=document.getElementById('intro'); intro.classList.add('gone'); setTimeout(()=>intro.hidden=true,2000);
  setTimeout(()=>{ripple(W/2,H/2,S*.5,1.5); sfxPlop(W/2,.8)},600);
  setTimeout(()=>sfxChime(),1200);
};
document.addEventListener('visibilitychange',()=>{ if(!AC) return; document.hidden?AC.suspend():AC.resume() });

/* ---------- rendu ---------- */
let T=0, last=performance.now(), shimmer=0, leafTimer=0;
function caustics(){
  const w=cau.width,h=cau.height,d=cimg.data, t=T*.7;
  for(let y=0;y<h;y++) for(let x=0;x<w;x++){
    const X=x*9,Y=y*9;
    const v=Math.sin(X*.021+t)+Math.sin(Y*.025-t*1.2)+Math.sin((X+Y)*.016+t*.8)+Math.sin((X-Y)*.012-t*.6+Math.sin(X*.01+t));
    const c=Math.pow(1-Math.abs(Math.sin(v*1.6)),7);
    const i=(y*w+x)*4; d[i]=200; d[i+1]=240; d[i+2]=220; d[i+3]=c*255;
  }
  cctx.putImageData(cimg,0,0);
}
function frame(now){
  const dt=Math.min(.05,(now-last)/1000); last=now; T+=dt;
  ctx.globalCompositeOperation='source-over'; ctx.globalAlpha=1;
  ctx.drawImage(floor,0,0,W,H);

  fish.forEach(f=>stepFish(f,dt));
  fish.forEach(drawShadow);
  // grains sous la surface : les plus anciens coulent
  for(let i=pellets.length-1;i>=0;i--){const p=pellets[i]; const age=T-p.born; if(p.gone||age>14){pellets.splice(i,1);continue}
    const sink=clamp(age/14,0,1); ctx.fillStyle=`rgba(196,150,90,${.95-sink*.7})`; ctx.beginPath(); ctx.arc(p.x,p.y,S*.0055*(1-sink*.4),0,TAU); ctx.fill()}
  fish.forEach(drawFish);

  // caustiques
  if(!RM||Math.floor(T*4)%4===0) caustics();
  ctx.globalCompositeOperation='lighter'; ctx.globalAlpha=.22+shimmer*.25; ctx.imageSmoothingEnabled=true;
  ctx.drawImage(cau,0,0,W,H); ctx.globalAlpha=1; shimmer*=Math.pow(.3,dt);
  ctx.globalCompositeOperation='source-over';

  // teinte d'eau
  ctx.fillStyle='rgba(10,50,48,.12)'; ctx.fillRect(0,0,W,H);

  // nénuphars
  pads.forEach(p=>drawPad(p,T));

  // feuilles d'érable
  leafTimer-=dt; if(leafTimer<=0){ leafTimer=rnd(1.8,4.5); if(leaves.length<46) spawnLeaf(false) }
  for(let i=leaves.length-1;i>=0;i--){const l=leaves[i]; l.age+=dt;
    if(l.z>0){ l.z-=l.vz*dt; l.x+=Math.sin(T*1.3+l.ph)*l.drift*S*.04*dt+l.wind*dt; l.y+=S*.02*dt; l.rot+=l.vr*dt*1.6;
      if(l.z<=0){ l.z=0; landed++; elL.textContent=landed; ripple(l.x,l.y,S*.05,.6); sfxLeaf(l.x) } }
    else { l.x+=(Math.sin(T*.3+l.ph)*S*.004+l.wind)*dt; l.y+=Math.cos(T*.25+l.ph)*S*.003*dt; l.rot+=l.vr*dt*.08; l.wind*=Math.pow(.4,dt) }
    l.wind*=Math.pow(.7,dt);
    if(l.age>70||l.x<-60||l.x>W+60||l.y>H+60){leaves.splice(i,1);continue}
    const fade=l.age>62?(70-l.age)/8:1, sc=l.size*(1+l.z*.6), off=l.z*S*.08;
    // ombre portée
    ctx.save(); ctx.translate(l.x+off,l.y+off*1.3); ctx.rotate(l.rot); ctx.scale(l.size,l.size);
    ctx.fillStyle=`rgba(0,10,12,${(.32-l.z*.22)*fade})`; ctx.fill(LEAF); ctx.restore();
    ctx.save(); ctx.translate(l.x,l.y); ctx.rotate(l.rot); ctx.scale(sc*(l.z>0?.7+.3*Math.abs(Math.sin(T*2+l.ph)):1),sc);
    ctx.fillStyle=`hsla(${l.hue},78%,${l.light}%,${fade})`; ctx.fill(LEAF);
    ctx.strokeStyle=`hsla(${l.hue},70%,${l.light+18}%,${.5*fade})`; ctx.lineWidth=.04; ctx.beginPath();
    for(const a of [-Math.PI/2,-Math.PI/2-1.1,-Math.PI/2+1.1,Math.PI*.2,Math.PI*.8]){ctx.moveTo(0,0);ctx.lineTo(Math.cos(a)*.75,Math.sin(a)*.75)}
    ctx.moveTo(0,0); ctx.lineTo(0,.6); ctx.stroke(); ctx.restore();
  }

  // rides
  ctx.lineWidth=1.2;
  for(let i=ripples.length-1;i>=0;i--){const q=ripples[i]; q.life-=dt*.55; q.r+=(q.max-q.r)*Math.min(1,dt*1.6); if(q.life<=0){ripples.splice(i,1);continue}
    for(let k=0;k<3;k++){const rr=q.r*(1-k*.22); if(rr<=0) continue; ctx.strokeStyle=`rgba(225,245,235,${q.life*.35*q.str/(k+1)})`; ctx.beginPath(); ctx.arc(q.x,q.y,rr,0,TAU); ctx.stroke()}}
  // bulles
  for(let i=bubbles.length-1;i>=0;i--){const b=bubbles[i]; b.life-=dt; if(b.life<=0){bubbles.splice(i,1);continue}
    ctx.strokeStyle=`rgba(235,250,245,${b.life*.7})`; ctx.lineWidth=1; ctx.beginPath(); ctx.arc(b.x,b.y,b.r*(1.6-b.life*.6),0,TAU); ctx.stroke()}

  // noms des koïs
  ctx.textAlign='center'; ctx.textBaseline='middle';
  for(const f of fish){ if(f.label<=0) continue; const a=Math.min(1,f.label,(3.2-f.label)*4), h=f.P[0];
    ctx.globalAlpha=a; ctx.fillStyle='rgba(8,24,26,.7)'; const y=h.y-f.L*.3;
    ctx.beginPath(); ctx.roundRect?ctx.roundRect(h.x-56,y-20,112,40,6):ctx.rect(h.x-56,y-20,112,40); ctx.fill();
    ctx.fillStyle='#f3ead8'; ctx.font='600 17px "Shippori Mincho", serif'; ctx.fillText(f.v.jp,h.x,y-6);
    ctx.fillStyle='#9fb5ad'; ctx.font='300 10px "Zen Kaku Gothic New", sans-serif'; ctx.fillText(f.v.name.toUpperCase(),h.x,y+11);
    ctx.globalAlpha=1 }

  // vignette
  const vg=ctx.createRadialGradient(W/2,H/2,S*.35,W/2,H/2,Math.hypot(W,H)*.62); vg.addColorStop(0,'rgba(4,14,15,0)'); vg.addColorStop(1,'rgba(4,14,15,.7)');
  ctx.fillStyle=vg; ctx.fillRect(0,0,W,H);

  // ambiance programmée
  if(started&&AC){
    if(T>nextShishi){ const d=sfxShishi(); nextShishi=T+rnd(24,38);
      setTimeout(()=>{const x=W*.92,y=H*.12; ripple(x,y,S*.35,1.8); setTimeout(()=>ripple(x,y,S*.22,1.2),200); fish.forEach(f=>{f.boost=.9})},d*1000) }
    if(T>nextBird){ sfxBird(); nextBird=T+rnd(7,18) }
  }
  requestAnimationFrame(frame);
}
addEventListener('resize',()=>{resize()});
resize(); initFish();
for(let i=0;i<10;i++){spawnLeaf(false); const l=leaves[leaves.length-1]; l.z=0; l.age=rnd(0,30); landed++}
elL.textContent=landed;
requestAnimationFrame(frame);
})();
</script>

</body></html>
